:root{
  /* PICO-8 palette */
  --k:#000; --navy:#1d2b53; --plum:#7e2553; --grn2:#008751; --brown:#ab5236; --gray:#5f574f; --lgray:#c2c3c7;
  --white:#fff1e8; --red:#ff004d; --orange:#ffa300; --yellow:#ffec27; --green:#00e436; --blue:#29adff; --lav:#83769c; --pink:#ff77a8;
  --bg:#0c0a1f; --panel:#1d2b53; --panel2:#16204a; --bd:#83769c; --text:#fff1e8; --text2:#a9a4c4; --text3:#6d6890;
  --ocean:#0a0f2e; --land:#008751; --land2:#00b85f; --grat:rgba(131,118,156,.22);
  --px:'PS2P','Courier New',monospace; --vt:'VT','Courier New',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:22px/1.1 var(--vt);color:var(--text);overflow:hidden;-webkit-font-smoothing:none;font-smooth:never;
  background:var(--bg);
  background-image:linear-gradient(rgba(131,118,156,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(131,118,156,.07) 1px,transparent 1px);
  background-size:24px 24px;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:999;
  background:repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.13) 2px 3px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}
.px{font-family:var(--px)}

.shell{height:100%;display:flex;flex-direction:column}
.bar{flex:none;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;
  background:var(--k);border-bottom:4px solid var(--bd)}
.brand{display:flex;align-items:center;gap:14px;font:14px var(--px);color:var(--yellow);letter-spacing:1px;text-shadow:3px 3px 0 var(--plum)}
.logo{width:28px;height:28px;image-rendering:pixelated}
.barr{display:flex;align-items:center;gap:8px}
.ibtn{width:40px;height:40px;display:grid;place-items:center;color:var(--lgray);background:var(--panel);
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.4),inset 4px 4px 0 rgba(255,255,255,.14),0 0 0 3px #000}
.ibtn:hover{color:var(--yellow)}
.ibtn:active{transform:translateY(2px)}
.ibtn svg{width:22px;height:22px;shape-rendering:crispEdges}

.grid{flex:1;min-height:0;display:grid;grid-template-columns:384px minmax(0,1fr);gap:26px;padding:24px 28px 28px}
.col{display:flex;flex-direction:column;gap:22px;min-height:0;min-width:0}
.side{overflow-y:auto;padding:4px 8px 8px 4px}
::-webkit-scrollbar{width:12px}
::-webkit-scrollbar-track{background:var(--k)}
::-webkit-scrollbar-thumb{background:var(--lav);border:2px solid var(--k)}

/* pixel panel: a flat box with stepped (notched) border and a hard drop shadow */
.card{position:relative;background:var(--panel);
  box-shadow:0 -4px 0 0 var(--bd),0 4px 0 0 var(--bd),-4px 0 0 0 var(--bd),4px 0 0 0 var(--bd),
             0 8px 0 0 #000,4px 8px 0 0 #000,-4px 8px 0 0 #000}
.pad{padding:18px 20px}
.cap{font:10px/1.4 var(--px);color:var(--yellow);letter-spacing:.5px;text-transform:uppercase}
.hint{font-size:20px;color:var(--text2);margin-top:10px;line-height:1.05}

/* hero */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 18px 18px;gap:8px}
.power{position:relative;width:116px;height:116px;display:grid;place-items:center;color:var(--lgray);background:var(--gray);
  box-shadow:inset -8px -8px 0 rgba(0,0,0,.4),inset 8px 8px 0 rgba(255,255,255,.2),0 0 0 4px #000,0 8px 0 4px #000}
.power svg{width:56px;height:56px;shape-rendering:crispEdges}
.power:hover:not(:disabled){color:var(--white);background:var(--lav)}
.power:active:not(:disabled){transform:translateY(4px);box-shadow:inset 8px 8px 0 rgba(0,0,0,.4),0 0 0 4px #000,0 4px 0 4px #000}
.power:disabled{opacity:.5;cursor:default}
.power.on{color:#000;background:var(--green)}
.power.busy{background:var(--orange);color:#000;animation:blink .7s steps(2) infinite}
@keyframes blink{50%{filter:brightness(.7)}}
.status{font:18px/1.2 var(--px);margin-top:16px;color:var(--text);text-shadow:3px 3px 0 #000}
.status.on{color:var(--green)}
.sub{color:var(--text2);min-height:24px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:22px}
.sub b{color:var(--white);font-weight:400}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:32px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;font:9px/1 var(--px);background:var(--k);color:var(--lgray);box-shadow:0 0 0 3px var(--gray)}
.chip.good{color:var(--green);box-shadow:0 0 0 3px #00872f}
.chip.warn{color:var(--orange);box-shadow:0 0 0 3px #8a5600}
.chip button{color:var(--blue);font:9px var(--px);text-decoration:underline}
.pulse{width:8px;height:8px;background:currentColor;animation:blink2 .8s steps(2) infinite}
@keyframes blink2{50%{opacity:.2}}
.speed{display:flex;gap:20px;justify-content:center;margin-top:8px;font-size:22px;color:var(--text2);min-height:22px}
.speed b{color:var(--white);font-weight:400}
.live{font-size:19px;color:var(--text3);min-height:20px}

/* controls */
.btn{padding:11px 14px;font:9px/1.2 var(--px);background:var(--lav);color:var(--white);white-space:nowrap;text-transform:uppercase;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.25),0 0 0 3px #000}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:inset 4px 4px 0 rgba(0,0,0,.35),0 0 0 3px #000}
.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--green);color:#000;box-shadow:inset -4px -4px 0 rgba(0,0,0,.28),inset 4px 4px 0 rgba(255,255,255,.4),0 0 0 3px #000}
.btn.sm{padding:8px 10px;font-size:8px}
.seg{display:flex;gap:6px;margin-top:12px}
.seg button{flex:1;padding:10px 6px;font:9px var(--px);color:var(--text2);background:var(--panel2);box-shadow:0 0 0 3px var(--gray);text-transform:uppercase}
.seg button.on{background:var(--yellow);color:#000;box-shadow:0 0 0 3px #000}
.row-h{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* banners */
.banner{padding:14px 16px;font-size:21px;display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--k);
  box-shadow:0 0 0 4px var(--blue);margin:4px}
.banner p{flex:1;word-break:break-word}
.banner.err{box-shadow:0 0 0 4px var(--red);color:var(--pink);align-items:flex-start}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.banner small{display:block;color:var(--text2);margin-top:4px;word-break:break-all;font-size:19px}
.bar2{height:14px;background:var(--navy);margin-top:10px;box-shadow:0 0 0 3px var(--gray)}
.bar2 i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--green) 0 8px,#00a82a 8px 10px);transition:width .3s}

/* checks */
.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-top:12px}
.chk{display:flex;align-items:center;gap:10px;padding:2px 0}
.chk i{width:12px;height:12px;background:var(--gray);flex:none;box-shadow:0 0 0 2px #000}
.chk i.g{background:var(--green)}.chk i.r{background:var(--red)}.chk i.y{background:var(--orange)}
.chk span{flex:1}
.chk em{font-style:normal;color:var(--text2);font-size:20px}

/* map */
.mapcard{flex:none;padding:16px 18px 12px}
.maphead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.legend{display:flex;gap:14px;font-size:19px;color:var(--text2);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;box-shadow:0 0 0 2px #000}
.mapbox{position:relative;width:100%;aspect-ratio:240/95;background:var(--ocean);box-shadow:0 0 0 4px #000;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.mapbox.drag{cursor:grabbing}
.mapbox canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.pins{position:absolute;inset:0}
.pin{position:absolute;transform:translate(-50%,-50%);width:16px;height:16px;background:var(--c);padding:0;
  box-shadow:0 0 0 3px #000,0 0 0 5px var(--white);z-index:2}
.pin:hover{z-index:30;filter:brightness(1.2)}
.pin.on{width:20px;height:20px;background:var(--blue);z-index:20;box-shadow:0 0 0 3px #000,0 0 0 6px var(--yellow)}
.pin.on::before{content:"";position:absolute;inset:-12px;border:3px solid var(--yellow);animation:ring 1s steps(4) infinite}
@keyframes ring{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.15);opacity:0}}
.pin b{position:absolute;top:-14px;right:-18px;min-width:20px;height:18px;background:var(--red);color:#fff;font:8px/18px var(--px);text-align:center;padding:0 3px;box-shadow:0 0 0 2px #000}
.tip{position:absolute;left:50%;bottom:calc(100% + 16px);transform:translateX(-50%);padding:9px 12px;white-space:nowrap;text-align:left;
  background:var(--k);box-shadow:0 0 0 3px var(--white);font-size:20px;line-height:1.1;opacity:0;pointer-events:none;color:var(--white)}
.tip strong{font:9px/1.5 var(--px);color:var(--yellow);font-weight:400}.tip em{font-style:normal;color:var(--text2);display:block}
.pin:hover .tip{opacity:1}
.pin.b .tip{bottom:auto;top:calc(100% + 16px)}
.pin.l .tip{left:0;transform:none}
.pin.r .tip{left:auto;right:0;transform:none}
.zoomctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:40}
.zoomctl button{width:34px;height:34px;display:grid;place-items:center;font:14px var(--px);color:var(--white);background:var(--lav);
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.25),0 0 0 3px #000}
.zoomctl button:active{transform:translateY(2px)}
.zoomctl button:hover{filter:brightness(1.15)}
.zoomctl svg{width:18px;height:18px;shape-rendering:crispEdges}
.zlvl{position:absolute;left:10px;bottom:8px;font:8px var(--px);color:var(--white);background:rgba(0,0,0,.7);padding:5px 6px;z-index:40;pointer-events:none}
.mapnote{font-size:19px;color:var(--text2);margin-top:12px;min-height:20px}

/* node list */
.listcard{flex:1;min-height:200px;display:flex;flex-direction:column}
.listhead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px}
.list{overflow-y:auto;padding:0 10px 10px;flex:1}
.node{display:flex;align-items:center;gap:12px;padding:9px 10px;position:relative}
.node+.node{border-top:2px dashed rgba(131,118,156,.35)}
.node.can{cursor:pointer}
.node.can:hover{background:rgba(255,255,255,.07)}
.node.act{background:rgba(41,173,255,.22);box-shadow:inset 4px 0 0 var(--yellow)}
.sig{display:flex;gap:2px;align-items:flex-end;height:18px;flex:none;width:30px}
.sig i{flex:1;background:#2d3566;display:block}
.sig i:nth-child(1){height:20%}.sig i:nth-child(2){height:40%}.sig i:nth-child(3){height:60%}.sig i:nth-child(4){height:80%}.sig i:nth-child(5){height:100%}
.sig.g i.f{background:var(--green)}.sig.y i.f{background:var(--orange)}.sig.r i.f{background:var(--red)}
.nm{flex:1;min-width:0}
.nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{color:var(--text2);font-size:18px}
.ms{font-size:22px;color:var(--text2);min-width:74px;text-align:right}
.ms.g{color:var(--green)}.ms.y{color:var(--orange)}.ms.r{color:var(--red)}
.tag{font:8px/1 var(--px);color:#000;background:var(--yellow);padding:3px 5px;margin-right:8px;vertical-align:2px}

/* subscription */
.sub-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sub-row .meta{min-width:0}
.sub-row .meta b{display:block;font-weight:400;color:var(--white);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub-row .meta span{color:var(--text2);font-size:19px}
.sub-row .acts{display:flex;gap:8px}
.sub-row.prof{padding:10px 0;border-top:2px solid var(--panel2)}.sub-row.prof.off{opacity:.55}
textarea,input[type=text]{width:100%;background:var(--k);color:var(--white);border:0;padding:10px 12px;font:20px/1.1 var(--vt);outline:none;resize:none;box-shadow:0 0 0 3px var(--gray)}
textarea:focus,input[type=text]:focus{box-shadow:0 0 0 3px var(--yellow)}
textarea::placeholder,input::placeholder{color:var(--text3)}
.edit{display:flex;flex-direction:column;gap:12px}
.edit h4{font:10px/1.4 var(--px);color:var(--yellow);font-weight:400}
.edit p{font-size:19px;color:var(--text2)}
.edit .row{display:flex;gap:10px;justify-content:flex-end}

/* settings modal */
.modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.72)}
.sheet{width:100%;max-width:580px;max-height:calc(100vh - 40px);overflow-y:auto;background:var(--panel);padding:6px 20px 20px;
  box-shadow:0 0 0 4px var(--bd),0 0 0 8px #000}
.sheet-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:16px 0 12px;background:var(--panel)}
.sheet-h h2{font:14px var(--px);font-weight:400;color:var(--yellow)}
.grp-t{font:9px var(--px);color:var(--blue);text-transform:uppercase;margin:18px 0 8px}
.grp{background:var(--panel2);box-shadow:0 0 0 3px var(--gray)}
.set{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 14px;border-bottom:2px dashed rgba(131,118,156,.3)}
.set:last-child{border-bottom:0}
.set div b{display:block;font-weight:400;color:var(--white)}
.set div span{font-size:19px;color:var(--text2)}
.field{padding:11px 14px;border-bottom:2px dashed rgba(131,118,156,.3)}
.field:last-child{border-bottom:0}
.field label{display:block;margin-bottom:6px;color:var(--white)}
.field span{display:block;font-size:19px;color:var(--text2);margin-top:6px}
.field textarea{min-height:76px}
.sw{position:relative;width:64px;height:30px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:2;margin:0}
.sw i{position:absolute;inset:0;background:var(--gray);box-shadow:0 0 0 3px #000}
.sw i::before{content:"OFF";position:absolute;right:8px;top:0;line-height:30px;font:8px/30px var(--px);color:var(--lgray)}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:24px;background:var(--white);box-shadow:inset -3px -3px 0 rgba(0,0,0,.25)}
.sw input:checked+i{background:var(--green)}
.sw input:checked+i::before{content:"ON";right:auto;left:10px;color:#000}
.sw input:checked+i::after{left:auto;right:3px}
.foot{display:flex;justify-content:space-between;align-items:center;padding:18px 4px 2px;color:var(--text3);font-size:19px}
.danger{color:var(--red);font:9px var(--px);text-decoration:underline}

/* narrow / small-window layout: one scrolling column */

/* mascot stage */
.stage{width:100%;aspect-ratio:112/44;image-rendering:pixelated;display:block;background:#0a0f2e;box-shadow:0 0 0 4px #000}
.sanim{width:min(560px,92vw);padding:18px;text-align:center;cursor:pointer}
.stext{margin-top:14px;font-size:20px;min-height:28px}
/* about */
.about{text-align:center;padding:6px 6px 4px}
.about canvas{width:168px;height:66px;image-rendering:pixelated;margin:6px auto 14px;display:block;box-shadow:0 0 0 4px #000}
.about h3{font:13px/1.6 var(--px);color:var(--yellow);font-weight:400;text-shadow:3px 3px 0 var(--plum)}
.about .ver{color:var(--text2);margin:4px 0 14px}
.about p{font-size:22px;line-height:1.15;color:var(--white);margin:0 0 12px}
.about .who{background:var(--k);box-shadow:0 0 0 3px var(--gray);padding:14px;margin:14px 0}
.about .who b{display:block;font:11px/1.6 var(--px);font-weight:400;color:var(--green)}
.about .who a:not(.btn){color:var(--blue);word-break:break-all;font-size:23px}
.about a.btn{color:var(--white);font-size:9px}
.about .row{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.about small{display:block;color:var(--text3);font-size:19px;margin-top:14px}
@media (max-width:860px){
  body{overflow:auto}
  .shell{height:auto;min-height:100%}
  .grid{display:flex;flex-direction:column;padding:18px 16px 26px;gap:22px}
  .col{display:contents}
  .side{overflow:visible;padding:0}
  .hero{order:1}#banner{order:2}.mapcard{order:3}.listcard{order:4;max-height:520px}#routing{order:5}#checkcard{order:6}#subcard{order:7}
  .bar{padding:0 16px;position:sticky;top:0;z-index:10}
}
@media (max-height:700px) and (min-width:861px){.hero{padding:14px 12px 12px}.power{width:92px;height:92px}.power svg{width:44px;height:44px}.status{margin-top:10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.alogo{display:flex;justify-content:center;margin-bottom:6px}.alogo svg{width:96px;height:96px;image-rendering:pixelated}
/* ---------- Apple-style theme (html[data-theme="apple"]) ---------- */
html[data-theme="apple"]{
  --bg:#f2f2f7; --panel:rgba(255,255,255,.80); --panel2:rgba(120,120,128,.10); --bd:rgba(60,60,67,.14);
  --text:#1d1d1f; --text2:#6e6e73; --text3:#a1a1a6; --k:rgba(120,120,128,.12); --white:#1d1d1f; --lgray:#6e6e73;
  --gray:rgba(120,120,128,.35); --navy:rgba(120,120,128,.18); --lav:rgba(120,120,128,.16); --plum:transparent;
  --yellow:#007aff; --green:#34c759; --blue:#007aff; --orange:#ff9500; --red:#ff3b30; --pink:#ff3b30; --ocean:#dde8f6;
  --land:#a9c9a0; --land2:#c3dcba; --grat:rgba(60,60,67,.10);
  --px:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; --vt:var(--px);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.07);
}
@media (prefers-color-scheme:dark){
  html[data-theme="apple"]{
    --bg:#000; --panel:rgba(30,30,32,.80); --panel2:rgba(120,120,128,.20); --bd:rgba(84,84,88,.55);
    --text:#f5f5f7; --text2:#98989f; --text3:#636366; --k:rgba(120,120,128,.24); --white:#f5f5f7; --lgray:#98989f;
    --gray:rgba(120,120,128,.5); --navy:rgba(120,120,128,.28); --lav:rgba(120,120,128,.30);
    --yellow:#0a84ff; --green:#30d158; --blue:#0a84ff; --orange:#ff9f0a; --red:#ff453a; --pink:#ff453a; --ocean:#0c1a30;
    --land:#2f5a43; --land2:#3e7557; --grat:rgba(235,235,245,.10);
    --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 34px rgba(0,0,0,.45);
  }
}
html[data-theme="apple"] body{font:14px/1.45 var(--px);letter-spacing:-.005em;-webkit-font-smoothing:antialiased;font-smooth:auto;
  background:radial-gradient(1100px 560px at 8% -12%,rgba(0,122,255,.10),transparent 62%),radial-gradient(900px 520px at 104% 0%,rgba(52,199,89,.08),transparent 60%),var(--bg);background-attachment:fixed}
html[data-theme="apple"] body::after{display:none}
html[data-theme="apple"] .bar{height:54px;background:var(--panel);backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--bd)}
html[data-theme="apple"] .brand{font:650 15px var(--px);color:var(--text);text-shadow:none;letter-spacing:-.01em}
html[data-theme="apple"] .logo{border-radius:8px;width:26px;height:26px}
html[data-theme="apple"] .ibtn{width:34px;height:34px;border-radius:10px;background:none;box-shadow:none;color:var(--text2)}
html[data-theme="apple"] .ibtn:hover{background:var(--k);color:var(--text)}
html[data-theme="apple"] .grid{gap:16px;padding:16px 22px 22px}
html[data-theme="apple"] .col{gap:12px}
html[data-theme="apple"] ::-webkit-scrollbar{width:8px}
html[data-theme="apple"] ::-webkit-scrollbar-track{background:transparent}
html[data-theme="apple"] ::-webkit-scrollbar-thumb{background:var(--k);border:0;border-radius:8px}
html[data-theme="apple"] .card{background:var(--panel);backdrop-filter:saturate(170%) blur(26px);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--shadow)}
html[data-theme="apple"] .pad{padding:16px 18px}
html[data-theme="apple"] .cap{font:600 12px var(--px);color:var(--text2);letter-spacing:.04em}
html[data-theme="apple"] .hint,html[data-theme="apple"] .edit p{font-size:12.5px;line-height:1.35;margin-top:8px}
html[data-theme="apple"] .power{width:112px;height:112px;border-radius:50%;background:var(--k);color:var(--text2);box-shadow:inset 0 0 0 1px var(--bd)}
html[data-theme="apple"] .power svg{width:48px;height:48px;shape-rendering:geometricPrecision}
html[data-theme="apple"] .power:hover:not(:disabled){background:var(--lav);color:var(--text)}
html[data-theme="apple"] .power:active:not(:disabled){transform:scale(.96);box-shadow:inset 0 0 0 1px var(--bd)}
html[data-theme="apple"] .power.on{background:var(--green);color:#fff;box-shadow:0 8px 24px rgba(52,199,89,.35)}
html[data-theme="apple"] .power.busy{background:var(--orange);color:#fff;animation:blink .9s ease-in-out infinite}
html[data-theme="apple"] .status{font:650 24px var(--px);letter-spacing:-.02em;text-shadow:none;margin-top:14px}
html[data-theme="apple"] .status.on{color:var(--green)}
html[data-theme="apple"] .sub{font-size:15px}
html[data-theme="apple"] .chip{font:500 12px var(--px);border-radius:999px;background:var(--k);color:var(--text2);box-shadow:none;padding:6px 11px}
html[data-theme="apple"] .chip.good{color:var(--green);background:rgba(52,199,89,.14);box-shadow:none}
html[data-theme="apple"] .chip.warn{color:var(--orange);background:rgba(255,149,0,.14);box-shadow:none}
html[data-theme="apple"] .chip button{font:500 12px var(--px)}
html[data-theme="apple"] .pulse{border-radius:50%}
html[data-theme="apple"] .speed,html[data-theme="apple"] .live,html[data-theme="apple"] .legend,html[data-theme="apple"] .mapnote,
html[data-theme="apple"] .nm small,html[data-theme="apple"] .ms,html[data-theme="apple"] .chk em,html[data-theme="apple"] .sub-row .meta span,
html[data-theme="apple"] .set div span,html[data-theme="apple"] .field span,html[data-theme="apple"] .foot,html[data-theme="apple"] .banner small{font-size:12.5px}
html[data-theme="apple"] .banner,html[data-theme="apple"] .chk,html[data-theme="apple"] .nm,html[data-theme="apple"] .about p,html[data-theme="apple"] .set div b,html[data-theme="apple"] .field label{font-size:14px}
html[data-theme="apple"] .btn{font:500 13px var(--px);text-transform:none;padding:9px 14px;border-radius:10px;background:var(--k);color:var(--text);box-shadow:none}
html[data-theme="apple"] .btn:active:not(:disabled){transform:scale(.97);box-shadow:none}
html[data-theme="apple"] .btn.pri{background:var(--blue);color:#fff;box-shadow:none}
html[data-theme="apple"] .btn.sm{font-size:12.5px;padding:6px 11px}
html[data-theme="apple"] .seg{gap:4px;background:var(--k);padding:3px;border-radius:11px}
html[data-theme="apple"] .seg button{font:500 13px var(--px);text-transform:none;background:none;box-shadow:none;border-radius:8px;color:var(--text2)}
html[data-theme="apple"] .seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
html[data-theme="apple"] .banner{background:var(--k);box-shadow:none;border-radius:14px;margin:4px 0}
html[data-theme="apple"] .banner.err{background:rgba(255,59,48,.12);color:var(--red);box-shadow:none}
html[data-theme="apple"] .bar2{height:6px;border-radius:6px;background:var(--k);box-shadow:none}
html[data-theme="apple"] .bar2 i{background:var(--blue);border-radius:6px}
html[data-theme="apple"] .chk i{border-radius:50%;box-shadow:none;width:10px;height:10px}
html[data-theme="apple"] .mapbox{border-radius:14px;box-shadow:inset 0 0 0 1px var(--bd)}
html[data-theme="apple"] .pin{border-radius:50%;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.35)}
html[data-theme="apple"] .pin.on{box-shadow:0 0 0 3px #fff,0 2px 8px rgba(0,122,255,.5)}
html[data-theme="apple"] .pin.on::before{border:2px solid var(--blue);border-radius:50%}
html[data-theme="apple"] .pin b{font:600 10px/18px var(--px);border-radius:9px;box-shadow:0 0 0 2px #fff}
html[data-theme="apple"] .tip{background:var(--panel);color:var(--text);box-shadow:var(--shadow),0 0 0 1px var(--bd);border-radius:10px;font-size:13px;backdrop-filter:blur(20px)}
html[data-theme="apple"] .tip strong{font:600 12px var(--px);color:var(--text)}
html[data-theme="apple"] .zoomctl button{border-radius:10px;background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.2)}
html[data-theme="apple"] .zoomctl svg{shape-rendering:geometricPrecision}
html[data-theme="apple"] .zlvl{font:600 10px var(--px);border-radius:6px;background:var(--panel);color:var(--text)}
html[data-theme="apple"] .node{border-radius:12px;padding:9px 10px}
html[data-theme="apple"] .node+.node{border-top:1px solid var(--bd)}
html[data-theme="apple"] .node.can:hover{background:var(--k)}
html[data-theme="apple"] .node.act{background:rgba(0,122,255,.12);box-shadow:none}
html[data-theme="apple"] .sig i{border-radius:2px;background:var(--k)}
html[data-theme="apple"] .tag{font:600 10px var(--px);background:var(--blue);color:#fff;border-radius:6px;padding:3px 6px}
html[data-theme="apple"] .sub-row.prof{border-top:1px solid var(--bd)}
html[data-theme="apple"] textarea,html[data-theme="apple"] input[type=text]{font:14px/1.4 var(--px);background:var(--k);color:var(--text);border-radius:10px;box-shadow:inset 0 0 0 1px var(--bd)}
html[data-theme="apple"] textarea:focus,html[data-theme="apple"] input[type=text]:focus{box-shadow:0 0 0 3px rgba(0,122,255,.35)}
html[data-theme="apple"] .edit h4{font:650 13px var(--px);color:var(--text)}
html[data-theme="apple"] .modal{background:rgba(0,0,0,.38);backdrop-filter:blur(8px)}
html[data-theme="apple"] .sheet{background:var(--bg);border-radius:22px;box-shadow:var(--shadow),0 0 0 1px var(--bd)}

const bars = d => d <= 0 ? 0 : d < 80 ? 5 : d < 150 ? 4 : d < 250 ? 3 : d < 400 ? 2 : 1;
const fmtMB = n => (n/1048576).toFixed(1) + ' MB';
function fmtSpeed(b){
  if(b < 1024) return b + ' B/s';
  if(b < 1048576) return (b/1024).toFixed(0) + ' KB/s';
  return (b/1048576).toFixed(1) + ' MB/s';
}
const CHECK_NAMES = ['Google','YouTube','GitHub','ChatGPT','Telegram','Baidu'];

/* ---------- interactive world map ----------
   World coordinates: u,v in 0..1 (equirectangular). View = zoom z (1 = whole world) + centre (cx,cy). */
let maskBits = null;
const V = {z:1, cx:.5, cy:.5};
const ZMAX = 40;
function decodeMask(){
  const bin = atob(MAP.data); maskBits = new Uint8Array(MAP.cols * MAP.rows);
  for(let i=0;i<maskBits.length;i++) maskBits[i] = (bin.charCodeAt(i>>3) >> (7 - (i&7))) & 1;
}
const geoU = lon => (lon + 180) / 360;
const geoV = lat => (MAP.latMax - lat) / (MAP.latMax - MAP.latMin);
function clampView(){
  V.z = Math.min(ZMAX, Math.max(1, V.z));
  const h = .5 / V.z;
  V.cx = Math.min(1 - h, Math.max(h, V.cx));
  V.cy = Math.min(1 - h, Math.max(h, V.cy));
}
function boxSize(){ const b = $('mapbox'); return [b.clientWidth, b.clientHeight]; }

function drawMap(){
  const cv = $('mapcv'), [W, H] = boxSize(); if(!W || !H) return;
  if(!maskBits) decodeMask();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  if(cv.width !== Math.round(W*dpr) || cv.height !== Math.round(H*dpr)){ cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.imageSmoothingEnabled = false; ctx.clearRect(0,0,W,H);
  const cw = W / MAP.cols * V.z, ch = H / MAP.rows * V.z;
  const ox = (.5 - V.cx * V.z) * W, oy = (.5 - V.cy * V.z) * H;      // screen = world*z*size + o
  // graticule every 30 degrees
  const cs = getComputedStyle(document.documentElement), LAND = cs.getPropertyValue('--land').trim() || '#008751', LAND2 = cs.getPropertyValue('--land2').trim() || '#00b85f';
  ctx.fillStyle = cs.getPropertyValue('--grat').trim() || 'rgba(131,118,156,.22)';
  for(let lon=-180; lon<=180; lon+=30){ const x = Math.round(geoU(lon) * W * V.z + ox); if(x>=0 && x<W) ctx.fillRect(x,0,1,H); }
  for(let lat=-60; lat<=90; lat+=30){ const y = Math.round(geoV(lat) * H * V.z + oy); if(y>=0 && y<H) ctx.fillRect(0,y,W,1); }
  const x0 = Math.max(0, Math.floor(-ox / cw)), x1 = Math.min(MAP.cols - 1, Math.ceil((W - ox) / cw));
  const y0 = Math.max(0, Math.floor(-oy / ch)), y1 = Math.min(MAP.rows - 1, Math.ceil((H - oy) / ch));
  const gap = cw >= 7 ? 1 : 0;
  for(let y=y0; y<=y1; y++){
    const sy = Math.round(oy + y*ch), sh = Math.round(oy + (y+1)*ch) - sy;
    for(let x=x0; x<=x1; x++){
      if(!maskBits[y*MAP.cols+x]) continue;
      const sx = Math.round(ox + x*cw), sw = Math.round(ox + (x+1)*cw) - sx;
      const edge = y === 0 || !maskBits[(y-1)*MAP.cols+x];
      ctx.fillStyle = LAND; ctx.fillRect(sx, sy, sw - gap, sh - gap);
      if(edge && sh >= 3){ ctx.fillStyle = LAND2; ctx.fillRect(sx, sy, sw - gap, Math.max(1, Math.round(sh*.34))); }
    }
  }
}
function flyTo(z, cx, cy){
  const from = {z:V.z, cx:V.cx, cy:V.cy}, t0 = performance.now(), D = 220;
  const to = {z:Math.min(ZMAX, Math.max(1, z)), cx, cy};
  cancelAnimationFrame(flyTo.raf);
  (function step(now){
    const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3);
    V.z = from.z * Math.pow(to.z / from.z, e);          // zoom is geometric so it feels even
    V.cx = from.cx + (to.cx - from.cx) * e; V.cy = from.cy + (to.cy - from.cy) * e;
    redrawMap();
    if(p < 1) flyTo.raf = requestAnimationFrame(step);
  })(t0);
}
function zoomAt(factor, mx, my){        // zoom keeping the point under (mx,my) fixed
  const [W, H] = boxSize();
  const u = (mx / W - .5) / V.z + V.cx, v = (my / H - .5) / V.z + V.cy;
  V.z *= factor; clampView();
  V.cx = u - (mx / W - .5) / V.z; V.cy = v - (my / H - .5) / V.z; clampView();
  redrawMap();
}
let mapRaf = 0;
function redrawMap(){
  if(mapRaf) return;
  mapRaf = requestAnimationFrame(() => { mapRaf = 0; clampView(); drawMap(); renderPins(); });
}
function fitServers(){
  const g = (S ? S.nodes : []).filter(n => n.hasGeo);
  if(!g.length){ flyTo(1, .5, .5); return; }
  let u0=1,u1=0,v0=1,v1=0;
  g.forEach(n => { const u = geoU(n.lon), v = geoV(n.lat); u0=Math.min(u0,u); u1=Math.max(u1,u); v0=Math.min(v0,v); v1=Math.max(v1,v); });
  const du = Math.max(.02, u1 - u0), dv = Math.max(.04, v1 - v0);
  const z = Math.max(1, Math.min(8, .78 / Math.max(du, dv)));
  flyTo(z, (u0+u1)/2, (v0+v1)/2);
}
(function mapInput(){
  const box = $('mapbox'), ptrs = new Map();
  let dragging = false, moved = 0, pinch0 = null, last = null;
  const rel = e => { const r = box.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  box.addEventListener('wheel', e => {
    e.preventDefault();
    const [mx, my] = rel(e);
    zoomAt(Math.exp(-Math.max(-120, Math.min(120, e.deltaY)) * 0.0022), mx, my);
  }, {passive:false});
  box.addEventListener('pointerdown', e => {
    if(e.target.closest('.zoomctl')) return;
    ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; last = [e.clientX, e.clientY];
    if(ptrs.size === 2){ const [a,b] = [...ptrs.values()]; pinch0 = {d: Math.hypot(a[0]-b[0], a[1]-b[1]) || 1}; }
  });
  box.addEventListener('pointermove', e => {
    if(!ptrs.has(e.pointerId)) return;
    const [W, H] = boxSize();
    ptrs.set(e.pointerId, [e.clientX, e.clientY]);
    if(ptrs.size === 2 && pinch0){
      const [a,b] = [...ptrs.values()], d = Math.hypot(a[0]-b[0], a[1]-b[1]) || 1;
      const r = box.getBoundingClientRect();
      zoomAt(d / pinch0.d, (a[0]+b[0])/2 - r.left, (a[1]+b[1])/2 - r.top); pinch0.d = d; moved = 99; return;
    }
    const dx = e.clientX - last[0], dy = e.clientY - last[1];
    moved += Math.abs(dx) + Math.abs(dy);
    if(!dragging && moved > 6){ dragging = true; box.classList.add('drag'); try{ box.setPointerCapture(e.pointerId); }catch(_){} }
    if(dragging){
      V.cx -= dx / (W * V.z); V.cy -= dy / (H * V.z); last = [e.clientX, e.clientY]; redrawMap();
    } else if(moved <= 6) { /* wait */ }
  });
  const up = e => { ptrs.delete(e.pointerId); if(ptrs.size < 2) pinch0 = null; if(!ptrs.size){ dragging = false; box.classList.remove('drag'); } };
  box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
  // a drag must not count as a click on a pin
  box.addEventListener('click', e => { if(moved > 6){ e.stopPropagation(); e.preventDefault(); moved = 0; } }, true);
  box.addEventListener('dblclick', e => { if(e.target.closest('.pin,.zoomctl')) return; const [mx,my] = rel(e); zoomAt(2, mx, my); });
  $('zin').onclick = () => flyTo(V.z * 1.8, V.cx, V.cy);
  $('zout').onclick = () => flyTo(V.z / 1.8, V.cx, V.cy);
  $('zfit').onclick = fitServers;
  $('zreset').onclick = () => flyTo(1, .5, .5);
  addEventListener('keydown', e => {
    if(showSettings || /INPUT|TEXTAREA/.test((e.target||{}).tagName||'')) return;
    if(e.key === '+' || e.key === '=') flyTo(V.z * 1.8, V.cx, V.cy);
    else if(e.key === '-' || e.key === '_') flyTo(V.z / 1.8, V.cx, V.cy);
    else if(e.key === '0') flyTo(1, .5, .5);
  });
})();
new ResizeObserver(redrawMap).observe($('mapbox'));

function renderPins(){
  if(!S){ return; }
  const [W, H] = boxSize(); if(!W) return;
  $('zlvl').textContent = (V.z < 10 ? V.z.toFixed(1) : Math.round(V.z)) + 'x';
  // group by identical coordinates
  const groups = new Map(); let unplaced = 0;
  for(const n of S.nodes){
    if(!n.hasGeo){ unplaced++; continue; }
    const k = n.lat.toFixed(2) + ',' + n.lon.toFixed(2);
    if(!groups.has(k)) groups.set(k, {lat:n.lat, lon:n.lon, place:n.place, nodes:[]});
    groups.get(k).nodes.push(n);
  }
  const items = [];
  for(const g of groups.values()){
    const u = geoU(g.lon), v = geoV(g.lat);
    const x = ((u - V.cx) * V.z + .5) * W, y = ((v - V.cy) * V.z + .5) * H;
    if(x < -24 || x > W + 24 || y < -24 || y > H + 24) continue;
    const live = g.nodes.filter(n => n.delay > 0).sort((a,b) => a.delay - b.delay);
    g.best = live[0] || g.nodes[0];
    g.act = S.connected && g.nodes.some(n => n.id === S.active);
    items.push({g, x, y, u, v});
  }
  // merge pins that would overlap at this zoom
  items.sort((a,b) => (b.g.act - a.g.act) || ((a.g.best.delay > 0 ? a.g.best.delay : 1e9) - (b.g.best.delay > 0 ? b.g.best.delay : 1e9)));
  const clusters = [], R = 20;
  for(const it of items){
    const c = clusters.find(c => Math.abs(c.x - it.x) < R && Math.abs(c.y - it.y) < R);
    if(c) c.members.push(it); else clusters.push({x: it.x, y: it.y, members: [it]});
  }
  let html = '';
  for(const c of clusters){
    const rep = c.members[0].g, best = rep.best;
    const count = c.members.reduce((s,m) => s + m.g.nodes.length, 0);
    const isAct = c.members.some(m => m.g.act);
    const multi = c.members.length > 1;
    const cls = 'pin' + (isAct ? ' on' : '') + (c.x < 90 ? ' l' : c.x > W - 90 ? ' r' : '') + (c.y < 70 ? ' b' : '');
    const delayTxt = best.delay > 0 ? `best ${best.delay} ms` : best.delay < 0 ? 'unreachable' : 'not tested';
    let title, lines;
    if(multi){
      title = c.members.length + ' places';
      lines = c.members.slice(0, 4).map(m => `<em>${esc(m.g.place)} · ${m.g.nodes.length}</em>`).join('') + (c.members.length > 4 ? '<em>…</em>' : '') + '<em>Click to zoom in</em>';
    } else {
      title = esc(rep.place);
      lines = `<em>${rep.nodes.length} server${rep.nodes.length>1?'s':''} · ${delayTxt}</em>` + (S.connected ? '<em>Click to use</em>' : '');
    }
    const cu = c.members.reduce((s,m) => s + m.u, 0) / c.members.length, cv = c.members.reduce((s,m) => s + m.v, 0) / c.members.length;
    html += `<button class="${cls}" style="left:${c.x.toFixed(1)}px;top:${c.y.toFixed(1)}px;--c:${isAct ? 'var(--blue)' : msColor(best.delay)}" ${multi ? `data-zoom="${cu.toFixed(5)},${cv.toFixed(5)}"` : `data-pin="${esc(best.id)}"`}>
      ${count > 1 ? `<b>${count}</b>` : ''}<span class="tip"><strong>${title}</strong>${lines}</span></button>`;
  }
  setHTML($('pins'), html);
  setHTML($('mapnote'), S.nodes.length === 0 ? 'Add a subscription to see where your servers are.'
    : (unplaced ? `${unplaced} server${unplaced>1?'s':''} could not be placed. ` : '') + 'Scroll or pinch to zoom · drag to move · double-click to zoom in');
}

/* ---------- shark-costume mascot: runs into a wall while connecting, jumps over it once connected ---------- */
const STAGE = (() => {
  const W = 112, H = 44, G = 40, WW = 8, WH = 14, FW = 12;
  const PAL = {F:'#3b5a8c', G:'#6d8fc7', W:'#fff1e8', K:'#000000', S:'#ffccaa', R:'#ff004d', Y:'#ffec27', B:'#29adff'};
  const A = {
    stand: [
      '.....FF.....','....FFF.....','...GGGGGG...','..GGGGGGGG..','..GKGGGGKG..','..GWWWWWWG..','..GWSSSSWG..','...GSKSKSG..',
      '..GGGGGGGG..','.GGWWWWWWGG.','.GGWWWWWWGG.','.SGWWWWWWGS.','...GGGGGG...','...GG..GG...','...GG..GG...','..KKK..KKK..'],
    run1: [
      '.....FF.....','....FFF.....','...GGGGGG...','..GGGGGGGG..','..GKGGGGKG..','..GWWWWWWG..','..GWSSSSWG..','...GSKSKSG..',
      '..GGGGGGGG..','..GWWWWWWGG.','.GGWWWWWWGS.','.SGWWWWWWG..','...GGGGGG...','..GG....GG..','.GG......GG.','.KK......KK.'],
    run2: [
      '.....FF.....','....FFF.....','...GGGGGG...','..GGGGGGGG..','..GKGGGGKG..','..GWWWWWWG..','..GWSSSSWG..','...GSKSKSG..',
      '..GGGGGGGG..','.GGWWWWWWG..','.SGWWWWWWGG.','..GWWWWWWGS.','...GGGGGG...','....GGGG....','....GGGG....','....KKKK....'],
    jump: [
      '.....FF.....','....FFF.....','...GGGGGG...','..GGGGGGGG..','..GKGGGGKG..','..GWWWWWWG..','.SGWSSSSWGS.','.GG.SKSK.GG.',
      '.GGGGGGGGGG.','..GWWWWWWG..','..GWWWWWWG..','...GGGGGG...','...GGGGGG...','..GG....GG..','..KK....KK..','............'],
    bonk: [
      '............','.....FF.....','....FFF.....','...GGGGGG...','..GGGGGGGG..','..GKGGGGKG..','..GWWWWWWG..','..GWRRRRWG..',
      '..GGGGGGGG..','.GGWWWWWWGG.','GG.WWWWWWG.G','.S.WWWWWWG.S','...GGGGGG...','...GG..GG...','...GG..GG...','..KKK..KKK..'],
  };
  const cv = $('stage'), ctx = cv.getContext('2d');
  cv.width = W; cv.height = H;
  let target = 'idle', phase = 'stand', t = 0, pt = 0;
  let x = 14, lift = 0, vy = 0, wallX = 70, scroll = 0, shake = 0, cloud = 0, bump = 0;
  let last = performance.now(), inited = false;

  function set(mode){
    if(!inited){ inited = true; target = mode; if(mode === 'connected'){ phase = 'cruise'; x = 44; wallX = -30; } return; }
    if(mode === target) return;
    target = mode;
    if(mode === 'idle'){ phase = 'stand'; x = 14; wallX = 70; lift = 0; }
    else if(mode === 'connecting'){
      if(phase === 'cruise'){ x = 14; wallX = 70; lift = 0; }
      phase = 'run'; pt = 0;
    }
    else if(mode === 'connected'){
      if(phase === 'stand'){ x = 14; wallX = 70; }
      phase = 'approach'; pt = 0;
    }
  }
  function px(r, c, color){ ctx.fillStyle = color; ctx.fillRect(c, r, 1, 1); }
  function sprite(rows, sx, sy){
    for(let r = 0; r < rows.length; r++) for(let c = 0; c < FW; c++){
      const ch = rows[r][c]; if(ch !== '.') px(Math.round(sy) + r, Math.round(sx) + c, PAL[ch]);
    }
  }
  function step(dt){
    t += dt; pt += dt;
    cloud = (cloud + dt * 6) % 160;
    if(phase === 'cruise'){ scroll += dt * 40; if(wallX > -20) wallX -= dt * 40; x += (44 - x) * Math.min(1, dt * 3); }
    else if(phase === 'run'){
      x += 50 * dt;
      if(x + 10 >= wallX){ x = wallX - 10; phase = 'bonk'; pt = 0; shake = 0.25; bump = 1; }
    }
    else if(phase === 'bonk'){
      if(bump){ x -= 40 * dt; if(pt > 0.15) bump = 0; }
      if(pt > 0.7){ phase = 'back'; pt = 0; }
    }
    else if(phase === 'back'){ x -= 22 * dt; if(x <= 14 || pt > 0.7){ phase = 'run'; pt = 0; if(x < 14) x = 14; } }
    else if(phase === 'approach'){
      x += 60 * dt;
      if(x >= wallX - 26){ phase = 'leap'; pt = 0; vy = 93.8; lift = 0; x = Math.min(x, wallX - 26); }
    }
    else if(phase === 'leap'){
      x += 50 * dt; vy -= 200 * dt; lift += vy * dt;
      if(lift <= 0 && vy < 0){ lift = 0; phase = 'cruise'; pt = 0; }
    }
    if(shake > 0) shake -= dt;
  }
  function draw(){
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0a0f2e'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#1d2b53'; ctx.fillRect(0, 26, W, 14);                    // distant hills band
    ctx.fillStyle = '#29365f'; for(let i = 0; i < 8; i++){ const hx = ((i * 17 - scroll * .3) % 136 + 136) % 136 - 12; ctx.fillRect(hx, 23, 9, 3); ctx.fillRect(hx + 2, 21, 5, 2); }
    ctx.fillStyle = '#fff1e8'; [[8,6],[40,10],[77,5],[102,12],[60,18],[24,15]].forEach(([a,b]) => ctx.fillRect(a, b, 1, 1));   // stars
    ctx.fillStyle = '#5f6a9c';                                                  // clouds
    for(let i = 0; i < 2; i++){ const cx = ((i * 70 - cloud) % 160 + 160) % 160 - 24; ctx.fillRect(cx + 3, 9, 14, 2); ctx.fillRect(cx, 11, 20, 2); ctx.fillRect(cx + 6, 7, 6, 2); }
    // ground
    ctx.fillStyle = '#008751'; ctx.fillRect(0, G, W, 4);
    ctx.fillStyle = '#00e436'; ctx.fillRect(0, G, W, 1);
    ctx.fillStyle = '#00b85f'; for(let i = 0; i < 9; i++){ const gx = ((i * 14 - scroll) % 126 + 126) % 126 - 6; ctx.fillRect(gx, G + 2, 3, 1); }
    // wall
    if(wallX > -WW){
      const sh = shake > 0 ? (Math.floor(t * 40) % 2 ? 1 : -1) : 0, wx = Math.round(wallX) + sh;
      for(let r = 0; r < WH; r++){
        const y = G - WH + r, odd = Math.floor(r / 3) % 2;
        for(let c = 0; c < WW; c++){
          const mortar = r % 3 === 2 || (c + (odd ? 2 : 0)) % 4 === 3;
          ctx.fillStyle = mortar ? '#5f574f' : (r < 3 ? '#c2c3c7' : '#ab5236');
          ctx.fillRect(wx + c, y, 1, 1);
        }
      }
      ctx.fillStyle = '#7e2553'; ctx.fillRect(wx, G - WH - 1, WW, 1);
    }
    // hero
    const f = Math.floor(t * 10) % 2;
    let rows = A.stand, bob = (phase === 'stand' || phase === 'back') && Math.floor(t * 2) % 2 ? 1 : 0;
    if(phase === 'run' || phase === 'approach' || phase === 'cruise') rows = f ? A.run1 : A.run2;
    if(phase === 'back') rows = A.stand;
    if(phase === 'leap') rows = A.jump;
    if(phase === 'bonk') rows = A.bonk;
    const sy = G - 16 - lift + (phase === 'cruise' && Math.floor(t * 5) % 2 ? -1 : 0) + bob * 0;
    sprite(rows, x, sy);
    if(phase === 'bonk'){                                                       // stars circling the head
      for(let i = 0; i < 3; i++){
        const a = t * 9 + i * 2.1;
        px(Math.round(sy - 1 + Math.sin(a) * 2), Math.round(x + 6 + Math.cos(a) * 6), i % 2 ? PAL.Y : PAL.W);
      }
    }
    if(target === 'connected' && phase === 'cruise' && Math.floor(t * 1.2) % 4 === 0){   // little sparkle
      px(Math.round(sy + 2), Math.round(x + 13), PAL.B); px(Math.round(sy + 1), Math.round(x + 14), PAL.W);
    }
  }
  function loop(now){
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    step(dt); draw(); requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  return {set};
})();

}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-pick],[data-tdone]'); if(!t) return;
  if(t.matches('[data-pick]')) pickTheme(t.dataset.pick);
  else { showTheme = false; renderTheme(); if(!S.settings.theme) pickTheme('pixel'); }
});
function maybeWelcome(){
  // one-time thank-you after the very first successful connection
  if(S && S.connected && !S.busy && !S.welcomed && !welcomeSent){
    welcomeSent = true;
    setTimeout(() => { welcome = true; showAbout = true; renderAbout(); }, 3600); // let the mascot finish its jump first
    call('/api/settings', {welcomed: true}).then(s => { S.welcomed = true; }).catch(() => {});
  }
}
function render(){
  maybeTheme();
  maybeWelcome();
  if(!S) return;
  const hasNodes = S.nodes.length > 0, coreOk = S.core.installed;
  const act_ = S.nodes.find(n => n.id === S.active);
  const connecting = S.busy === 'connecting' || S.busy === 'reconnecting';

  const power = $('power');
  power.className = 'power' + (S.connected ? ' on' : '') + (connecting ? ' busy' : '');
  power.disabled = !coreOk || !hasNodes || S.busy === 'updating';
  const st = $('status');
  let sub = '';
  if(connecting){ st.textContent = 'LOADING...'; st.className = 'status'; sub = 'Checking which servers are alive'; }
  else if(S.connected){ st.textContent = 'ONLINE'; st.className = 'status on';
    sub = act_ ? `<b>${esc(act_.name)}</b>` : (S.testing ? 'Finding the fastest server…' : 'Starting…'); }
  else { st.textContent = 'OFFLINE'; st.className = 'status';
    sub = !coreOk ? 'One-time setup needed below' : !hasNodes ? 'Add your subscription to begin' : 'Press the big button to connect'; }
  setHTML($('substatus'), sub);
  STAGE.set(connecting ? 'connecting' : S.connected ? 'connected' : 'idle');
  updateAnim(connecting);

  let chips = '';
  if(S.connected){
    if(act_ && act_.delay > 0) chips += `<span class="chip good num">PING ${act_.delay}ms</span>`;
    if(S.netDown) chips += `<span class="chip warn"><span class="pulse"></span>NO INTERNET</span>`;
    else if(S.testing) chips += `<span class="chip warn"><span class="pulse"></span>TESTING</span>`;
    else chips += S.pinned
      ? `<span class="chip warn">PINNED <button data-auto>AUTO</button></span>`
      : `<span class="chip good">AUTO · FASTEST</span>`;
  }
  setHTML($('chips'), chips);
  setHTML($('speed'), S.connected ? `<span>↓ <b>${fmtSpeed(S.down)}</b></span><span>↑ <b>${fmtSpeed(S.up)}</b></span>` : '');
  setHTML($('live'), S.connected && S.live > 0 ? `last real request: ${S.live} ms` : '');

  // banner
  let banner = '';
  const err = pendingErr || S.error || S.core.error;
  if(!coreOk){
    if(S.core.downloading){
      const pct = S.core.total > 0 ? Math.min(100, S.core.done / S.core.total * 100) : 0;
      banner = `<div class="banner"><div style="flex:1"><div>Downloading the proxy core… ${S.core.total>0 ? fmtMB(S.core.done)+' / '+fmtMB(S.core.total) : fmtMB(S.core.done)}</div><div class="bar2"><i style="width:${pct}%"></i></div></div></div>`;
    } else {
      banner = `<div class="banner"><div style="flex:1"><div>Sharkoxy needs the open-source <b>sing-box</b> core (about 15 MB).</div><small>No internet to GitHub? Put <b>sing-box.exe</b> in the folder below, then restart.<br>${esc(S.core.dir)}</small></div>
        <div class="acts"><button class="btn pri sm" data-install>Download</button><button class="btn sm" data-folder>Folder</button></div></div>`;
    }
  }
  if(S.update && S.update.ready){
    banner += `<div class="banner" style="margin-top:${banner?14:4}px"><div style="flex:1"><div>New version <b>${esc(S.update.available)}</b> is ready.</div>${S.update.notes ? `<small>${esc(S.update.notes)}</small>` : ''}</div>
      <div class="acts"><button class="btn pri sm" data-applyupd>Restart & update</button></div></div>`;
  }
  if(err) banner += `<div class="banner err" style="margin-top:${banner?14:4}px"><p>${esc(err)}</p></div>`;
  setHTML($('banner'), banner);

  // routing
  setHTML($('routing'), `<div class="cap">Routing</div>
    <div class="seg"><button data-mode="smart" class="${S.settings.bypass?'on':''}">Smart</button><button data-mode="global" class="${S.settings.bypass?'':'on'}">Global</button></div>
    <p class="hint">${S.settings.bypass ? 'China sites go direct; everything else uses the fastest server.' : 'Everything goes through the fastest server.'}</p>`);

  // connectivity
  const res = {}; (S.checks || []).forEach(c => res[c.name] = c.ms);
  const rows = CHECK_NAMES.map(n => {
    const ms = res[n];
    let cls = '', txt = '—';
    if(S.checking){ txt = '…'; }
    else if(ms > 0){ cls = ms < 400 ? 'g' : 'y'; txt = ms + ' ms'; }
    else if(ms < 0){ cls = 'r'; txt = 'blocked'; }
    return `<div class="chk"><i class="${cls}"></i><span>${n}</span><em class="num">${txt}</em></div>`;
  }).join('');
  setHTML($('checkcard'), `<div class="row-h"><div class="cap">Connectivity</div><button class="btn sm" data-check ${(!S.connected||S.checking)?'disabled':''}>${S.checking?'Checking':'Check'}</button></div><div class="checks">${rows}</div>`);

  // nodes list
  $('listcard').classList.toggle('hidden', !hasNodes);
  if(hasNodes){
    $('listtitle').textContent = `${S.nodes.length} server${S.nodes.length>1?'s':''}`;
    $('retest').disabled = !S.connected || S.testing;
    const rank = n => n.delay > 0 ? n.delay : n.delay === 0 ? 1e6 : 2e6;
    const sorted = [...S.nodes].sort((a,b) => (a.id===S.active ? -1 : b.id===S.active ? 1 : 0) || rank(a) - rank(b));
    setHTML($('list'), sorted.map(n => {
      const c = n.delay < 0 ? 'r' : msClass(n.delay), nb = bars(n.delay);
      const ms = n.delay > 0 ? n.delay + ' ms' : n.delay < 0 ? 'timeout' : (S.connected && S.testing ? '…' : '—');
      const isAct = S.connected && n.id === S.active;
      return `<div class="node num ${S.connected?'can':''} ${isAct?'act':''}" data-id="${esc(n.id)}">
        <span class="sig ${c}">${[1,2,3,4,5].map(i => `<i class="${i<=nb?'f':''}"></i>`).join('')}</span>
        <div class="nm"><div>${isAct ? '<span class="tag">IN USE</span>' : ''}${esc(n.name)}</div><small>${esc(n.type.toUpperCase())}${n.place ? ' · ' + esc(n.place) : ''}${(S.profiles||[]).length>1 && n.src ? ' · ' + esc(n.src) : ''}</small></div>
        <span class="ms ${c}">${ms}</span></div>`;
    }).join(''));
  }
  renderPins();

  // subscription
  const P = S.profiles || [], busyU = S.busy === 'updating';
  let sc = '';
  if(!P.length || editSub){
    sc = `<div class="edit"><h4>${P.length ? 'ADD ANOTHER SUBSCRIPTION' : 'ADD SUBSCRIPTION'}</h4>
      <p>Paste a subscription link (v2ray or Clash), a Clash profile, or share links.${P.length ? ' Your servers from all profiles are combined and Sharkoxy picks the fastest.' : ''}</p>
      <input id="subName" type="text" placeholder="Name (optional), e.g. Work" spellcheck="false" maxlength="40">
      <textarea id="subInput" rows="3" placeholder="https://… or vless://…" spellcheck="false"></textarea>
      <div class="row">${P.length ? '<button class="btn" data-cancel>Cancel</button>' : ''}<button class="btn pri" data-save ${busyU?'disabled':''}>${busyU ? 'Fetching' : 'Save & fetch'}</button></div></div>`;
  } else {
    sc = `<div class="cap" style="margin-bottom:10px">Profiles</div>` + P.map(p =>
      `<div class="sub-row prof ${p.off?'off':''}"><div class="meta"><b>${esc(p.name)}</b><span>${p.off ? 'Off' : p.count + ' servers'}${p.updated ? ' · ' + esc(p.updated) : ''}</span></div>
      <div class="acts">${p.refreshable ? `<button class="btn sm" data-pupdate="${esc(p.id)}" ${S.busy?'disabled':''}>${busyU?'Wait':'Update'}</button>` : ''}
      <button class="btn sm" data-ptoggle="${esc(p.id)}" ${S.busy?'disabled':''}>${p.off?'Turn on':'Off'}</button>
      <button class="btn sm" data-pdel="${esc(p.id)}" title="Remove" ${S.busy?'disabled':''}>✕</button></div></div>`).join('') +
      `<div class="row" style="margin-top:12px;justify-content:space-between">${P.length>1?`<button class="btn sm" data-pall ${S.busy?'disabled':''}>Update all</button>`:'<span></span>'}<button class="btn sm pri" data-edit>+ Add</button></div>`;
  }
  setHTML($('subcard'), sc);

  // settings
  $('modal').classList.toggle('hidden', !showSettings);
  if(showSettings){
    const s = S.settings;
    const sw = (id, on) => `<label class="sw"><input type="checkbox" id="${id}" ${on?'checked':''}><i></i></label>`;
    setHTML($('sheet'), `
      <div class="sheet-h"><h2>SETTINGS</h2><button class="btn sm pri" data-close>Done</button></div>
      <div class="grp-t">Appearance</div>
      <div class="grp"><div style="padding:8px 14px">${themeCards(s.theme || 'pixel')}</div></div>
      <div class="grp-t">Fastest server</div>
      <div class="grp">
        <div class="set"><div><b>Always on the fastest</b><span>Sharkoxy times every server (best of 3 tries) and moves you to the fastest one on its own. It also re-tests after the PC wakes from sleep.</span></div></div>
        <div class="field"><label>Re-check every</label>
          <div class="seg" style="margin-top:2px">${[[30,'30 s'],[60,'1 min'],[120,'2 min'],[300,'5 min']].map(([v,l]) => `<button data-secs="${v}" class="${s.checkSecs===v?'on':''}">${l}</button>`).join('')}</div></div>
      </div>
      <div class="grp-t">Startup</div>
      <div class="grp">
        <div class="set"><div><b>Launch at login</b><span>Starts in the background with Windows</span></div>${sw('autoStart', s.autoStart)}</div>
        <div class="set"><div><b>Connect automatically</b><span>Connect as soon as Sharkoxy starts</span></div>${sw('autoConnect', s.autoConnect)}</div>
      </div>
      <div class="grp-t">Network</div>
      <div class="grp">
        <div class="set"><div><b>Set system proxy</b><span>Route Windows apps through Sharkoxy</span></div>${sw('sysProxy', s.sysProxy)}</div>
        <div class="set"><div><b>Share on local network</b><span>${S.proxy ? 'Other devices can use port ' + esc(S.proxy.split(':')[1]) + ' on this PC' : 'Let phones and other PCs use this connection'}</span></div>${sw('lan', s.lan)}</div>
      </div>
      <div class="grp-t">Subscription</div>
      <div class="grp">
        <div class="set"><div><b>Refresh subscriptions every 12 hours</b><span>Keeps your server lists current</span></div>${sw('autoUpdate', s.autoUpdate)}</div>
        <div class="set"><div><b>Shark animation when connecting</b><span>A short popup while the connection is made</span></div>${sw('anim', !s.noAnim)}</div>
        <div class="set"><div><b>Keep Sharkoxy up to date</b><span>Downloads signed updates in the background and asks before restarting</span></div>${sw('selfUpdate', s.selfUpdate)}</div>
      </div>
      <div class="grp-t">Custom rules</div>
      <div class="grp">
        <div class="field"><label>Always direct</label><textarea id="directList" placeholder="school.edu.cn&#10;company.com" spellcheck="false">${esc(s.directList)}</textarea><span>One domain per line. Subdomains are included.</span></div>
        <div class="field"><label>Always through the proxy</label><textarea id="proxyList" placeholder="example.cn" spellcheck="false">${esc(s.proxyList)}</textarea><span>Wins over the built-in China list.</span></div>
      </div>
      <div class="grp-t">Clash compatibility</div>
      <div class="grp">
        <div class="set"><div><b>Clash dashboard access</b><span>Lets Clash dashboards (yacd, MetaCubeXD) view and switch servers</span></div>${sw('clashApi', s.clashApi)}</div>
        ${s.clashApi ? (S.controller ? `<div class="field"><label>Controller</label><input type="text" readonly value="${esc(S.controller)}" onfocus="this.select()"><span style="margin-top:10px">Secret</span><input type="text" readonly value="${esc(S.secret)}" onfocus="this.select()" style="margin-top:6px"></div>` : `<div class="field"><span style="margin:0">Connect to see the controller address and secret.</span></div>`) : ''}
      </div>
      <div class="grp-t">Advanced</div>
      <div class="grp">
        <div class="field"><label>Ping test URL</label><input type="text" id="testUrl" value="${esc(s.testUrl)}"><span>Plain http:// gives the lowest, truest round trip. https:// adds handshake time to every number.</span></div>
        <div class="field"><label>GitHub mirror prefix</label><input type="text" id="mirror" value="${esc(s.mirror)}" placeholder="https://your-mirror.example"><span>Only used when downloading the core.</span></div>
      </div>
      <div class="foot"><span>Sharkoxy ${esc(S.version)}${S.core.version ? ' · sing-box ' + esc(S.core.version) : ''}</span><button class="danger" data-quit>QUIT</button></div>`);
  }
}

/* ---------- about ---------- */
let showAbout = false, welcome = false, welcomeSent = false;
const LOGO = (document.querySelector('.logo') || {outerHTML:''}).outerHTML;
const EMAIL = 'bookcollectionforcloud@gmail.com';
function renderAbout(){
  $('amodal').classList.toggle('hidden', !showAbout);
  if(!showAbout) return;
  setHTML($('asheet'), `
    <div class="sheet-h"><h2>${welcome ? 'WELCOME ABOARD!' : 'ABOUT'}</h2><button class="btn sm pri" data-aclose>Close</button></div>
    <div class="about">
      <div class="alogo">${LOGO}</div>
      <h3>SHARKOXY</h3>
      <div class="ver">version ${esc(S ? S.version : '')}${S && S.core.version ? ' · sing-box ' + esc(S.core.version) : ''}</div>
      <p>${welcome ? 'You are connected. ' : ''}Thank you for downloading Sharkoxy!</p>
      <p>It is free, open source and made with care, so that getting online stays simple and fast wherever you are.</p>
      <div class="who">
        <div class="cap" style="margin-bottom:8px">Created by</div>
        <b>SHAHRIAR RAHMAN</b>
        <div style="margin:8px 0 4px;color:var(--text2)">Questions, bugs, ideas, or just a hello:</div>
        <a href="mailto:${EMAIL}">${EMAIL}</a>
        <div class="row"><button class="btn sm" data-copymail>Copy email</button><a class="btn sm" href="mailto:${EMAIL}" style="text-decoration:none;display:inline-block">Write email</a></div>
      </div>
      <p style="font-size:20px;color:var(--text2)">Sharkoxy is licensed under GPL-3.0 and is powered by the open-source sing-box engine. If it helps you, tell a friend.</p>
      <small>Not affiliated with sing-box, SagerNet or Karing.</small>
    </div>`);
}
document.addEventListener('click', e => {
  const t = e.target.closest('#about,[data-aclose],[data-copymail]'); if(!t) return;
  if(t.id === 'about'){ showAbout = true; renderAbout(); }
  else if(t.matches('[data-aclose]')){ showAbout = false; welcome = false; renderAbout(); }
  else if(t.matches('[data-copymail]')){
    const done = () => { t.textContent = 'Copied!'; setTimeout(() => { t.textContent = 'Copy email'; }, 1500); };
    try{ navigator.clipboard.writeText(EMAIL).then(done, fallback); }catch(_){ fallback(); }
    function fallback(){ const ta = document.createElement('textarea'); ta.value = EMAIL; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(_){} ta.remove(); done(); }
  }
});
$('amodal').addEventListener('mousedown', e => { if(e.target === $('amodal')){ showAbout = false; welcome = false; renderAbout(); } });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && showAbout){ showAbout = false; welcome = false; renderAbout(); } });

/* ---------- events ---------- */
$('gear').onclick = () => { showSettings = true; render(); };
$('power').onclick = () => { userConnect = !S.connected; act(S.connected ? '/api/disconnect' : '/api/connect'); };
$('retest').onclick = () => act('/api/test');
$('modal').addEventListener('mousedown', e => { if(e.target === $('modal')){ showSettings = false; render(); } });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && showSettings){ showSettings = false; render(); } });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-auto],[data-install],[data-folder],[data-save],[data-cancel],[data-pupdate],[data-ptoggle],[data-pdel],[data-pall],[data-applyupd],[data-edit],[data-quit],[data-close],[data-check],[data-mode],[data-pin],[data-zoom],[data-secs],.node.can');
  if(!t) return;
  if(t.matches('[data-auto]')) act('/api/select', {id: 'auto'});
  else if(t.matches('[data-install]')) act('/api/core/install');
  else if(t.matches('[data-folder]')) act('/api/core/folder');
  else if(t.matches('[data-check]')) act('/api/check');
  else if(t.matches('[data-mode]')) act('/api/settings', {bypass: t.dataset.mode === 'smart'});
  else if(t.matches('[data-secs]')) act('/api/settings', {checkSecs: +t.dataset.secs});
  else if(t.matches('[data-zoom]')){ const [u,v] = t.dataset.zoom.split(',').map(Number); flyTo(V.z * 2.6, u, v); }
  else if(t.matches('[data-pin]')){ if(S.connected) act('/api/select', {id: t.dataset.pin}); }
  else if(t.matches('[data-save]')){ const v = $('subInput').value.trim(); if(v){ editSub = false; act('/api/profile', {action:'add', input: v, name: $('subName').value.trim()}); } }
  else if(t.matches('[data-cancel]')){ editSub = false; render(); }
  else if(t.matches('[data-pupdate]')) act('/api/profile', {action:'update', id: t.dataset.pupdate});
  else if(t.matches('[data-applyupd]')){ t.disabled = true; t.textContent = 'Updating…'; call('/api/update/apply', {}).catch(e => { pendingErr = String(e.message || e); render(); }); }
  else if(t.matches('[data-pall]')) act('/api/profile', {action:'updateAll'});
  else if(t.matches('[data-ptoggle]')) act('/api/profile', {action:'toggle', id: t.dataset.ptoggle});
  else if(t.matches('[data-pdel]')){ if(confirm('Remove this profile and its servers?')) act('/api/profile', {action:'remove', id: t.dataset.pdel}); }
  else if(t.matches('[data-edit]')){ editSub = true; render(); }
  else if(t.matches('[data-close]')){ showSettings = false; render(); }
  else if(t.matches('[data-quit]')){ call('/api/quit', {}).catch(()=>{}); document.body.innerHTML = '<p style="padding:60px;color:#a9a4c4;text-align:center;font:12px/2 PS2P,monospace">GAME OVER<br><br>Sharkoxy closed. You can close this window.</p>'; }
  else if(t.matches('.node.can')) act('/api/select', {id: t.dataset.id});
});
document.addEventListener('change', e => {
  const el = e.target, id = el.id;
  if(id === 'anim') act('/api/settings', {noAnim: !el.checked});
  else if(['sysProxy','autoStart','autoConnect','autoUpdate','selfUpdate','lan','clashApi'].includes(id)) act('/api/settings', {[id]: el.checked});
  else if(['testUrl','mirror','directList','proxyList'].includes(id)) act('/api/settings', {[id]: el.value});
});

async function tick(){
  let fast = false;
  try{
    S = await call('/api/state');
    fast = !!(S.busy || S.testing || S.checking || S.core.downloading);
    if(!S.connected) autoChecked = false;
    else if(!autoChecked && S.active && !S.testing && (!S.checks || !S.checks.length) && !S.checking){
      autoChecked = true; call('/api/check', {}).catch(()=>{});
    }
    render();
  }catch(e){
    $('status').textContent = 'NO SIGNAL';
  }
  setTimeout(tick, fast || (S && S.connected) ? 1000 : 2500);
}
decodeMask(); drawMap(); tick();
</script>
</body>
</html>
